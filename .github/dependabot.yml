# Keeps dependencies current. Security updates (Dependabot alerts with
# fixes) arrive as they are published; the weekly runs cover ordinary bumps,
# minor and patch grouped, each major on its own so one that breaks holds up
# nothing else.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
